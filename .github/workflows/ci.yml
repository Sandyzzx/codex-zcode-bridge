name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - preview
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0

jobs:
  impact:
    name: Select impact gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force_full: ${{ steps.select.outputs.force_full }}
      full_required: ${{ steps.select.outputs.full_required }}
      integration_required: ${{ steps.select.outputs.integration_required }}
      stress_required: ${{ steps.select.outputs.stress_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: select
        name: Shadow-compare impact selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/ci-select-impact.mjs --head "$HEAD_SHA" --force-full --github-output
          else
            node scripts/ci-select-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          fi

  fast:
    name: Fast PR gate
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.full_required != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fast targeted selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Fast impact selection requires a valid base SHA"
            exit 1
          fi
          npm run test:affected -- --base "$BASE_SHA"

  integration:
    name: Integration gate (Windows)
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.integration_required == 'true' && needs.impact.outputs.full_required != 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # This job owns T0 exactly once. The impacted-test command below only
      # selects, compiles, and runs tests after these steps have succeeded.
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:plugin
      - run: npm run check:generated
      - run: git diff --check
      - name: Verify Windows worker process identity
        run: node scripts/verify-windows-worker-identity.mjs
      - name: Impacted integration and task-lifecycle tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CODEX_BRIDGE_CI_T0_COMPLETED: "1"
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Integration selection requires a valid base SHA"
            exit 1
          fi
          npm run test:affected -- --base "$BASE_SHA" --tests-only

  release:
    name: Verify (${{ matrix.os }})
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.impact.result == 'success' && needs.impact.outputs.full_required == 'true'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2025 currently times out the documented PowerShell
        # process-identity probe. Keep lifecycle verification on Server 2022.
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Windows worker process identity
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-worker-identity.mjs
      - run: npm test
      - run: npm run validate:plugin
      - name: Verify complete generated-artifact freshness
        run: npm run check:generated
      - name: Check patch whitespace
        run: git diff --check

  sqlite-stress:
    name: SQLite resource matrix (${{ matrix.os }})
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.impact.result == 'success' && (needs.impact.outputs.force_full == 'true' || needs.impact.outputs.full_required == 'true' || needs.impact.outputs.stress_required == 'true')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:stress
