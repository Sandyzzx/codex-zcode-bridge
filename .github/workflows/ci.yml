name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - master
      - preview
  workflow_dispatch:
    inputs:
      release_gate:
        description: Run the complete release gate instead of the development gate
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0

jobs:
  impact:
    name: Select impact gates
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force_full: ${{ steps.select.outputs.force_full }}
      full_required: ${{ steps.select.outputs.full_required }}
      development_test_count: ${{ steps.select.outputs.development_test_count }}
      integration_required: ${{ steps.select.outputs.integration_required }}
      stress_required: ${{ steps.select.outputs.stress_required }}
      cost_lab_required: ${{ steps.select.outputs.cost_lab_required }}
      release_required: ${{ steps.release.outputs.release_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: select
        name: Shadow-compare impact selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/ci-select-impact.mjs --head "$HEAD_SHA" --force-full --github-output
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/ci-select-impact.mjs --head "$HEAD_SHA" --force-full --github-output
          else
            node scripts/ci-select-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          fi
      - id: release
        name: Select release gate
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_gate) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'release-candidate')) }}
        run: |
          if [[ "$RELEASE_REQUESTED" == "true" ]]; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            echo "Complete release gate requested."
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
            echo "Development gate selected; complete release gate deferred."
          fi

  fast:
    name: Fast PR gate
    needs: impact
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.impact.result == 'success'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.impact.result == 'success' && needs.impact.outputs.release_required != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: needs.impact.result == 'success' && needs.impact.outputs.release_required != 'true'
      - name: Impact selection failed
        if: needs.impact.result != 'success'
        shell: bash
        run: |
          echo "::error::Impact selection did not complete successfully."
          exit 1
      - name: Release gate owns T0
        if: needs.impact.outputs.release_required == 'true'
        shell: bash
        run: echo "Fast development checks deferred to the requested complete release gate."
      - name: Fast targeted selection
        if: needs.impact.outputs.release_required != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            npm run test:affected -- --force-full --development
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Fast impact selection requires a valid base SHA"
            exit 1
          else
            npm run test:affected -- --base "$BASE_SHA" --development
          fi

  integration:
    name: Integration gate (Windows)
    needs: [impact, fast]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.fast.result == 'success' && needs.impact.outputs.release_required != 'true' && needs.impact.outputs.integration_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fast owns the platform-independent T0 checks. This Windows gate only
      # builds the Windows execution artifacts and runs the selected tests.
      - run: npm run build
      - name: Verify Windows worker process identity
        run: node scripts/verify-windows-worker-identity.mjs
      - name: Impacted integration and task-lifecycle tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CODEX_BRIDGE_CI_T0_COMPLETED: "1"
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Integration selection requires a valid base SHA"
            exit 1
          fi
          npm run test:affected -- --base "$BASE_SHA" --safe-tests-only

  verify-windows:
    name: Windows Verify shard ${{ matrix.shard }}/2
    needs: impact
    if: always() && (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.impact.result == 'success'))
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm run build
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - name: Verify Windows worker process identity
        if: matrix.shard == 1 && (github.event_name == 'push' || needs.impact.outputs.release_required == 'true')
        run: node scripts/verify-windows-worker-identity.mjs
      - name: Prepare isolated shard directories
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        shell: pwsh
        env:
          SHARD_TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          SHARD_FIXTURES: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:SHARD_TEMP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SHARD_FIXTURES | Out-Null
      - name: Run Windows shard
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        env:
          WP6_TEST_FIXTURE_ROOT: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
          TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMPDIR: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
        run: npm run test:shard -- --shard=${{ matrix.shard }}/2
      - name: Full Windows suite deferred
        if: github.event_name != 'push' && needs.impact.outputs.release_required != 'true'
        shell: bash
        run: 'echo "FULL_SUITE_DEFERRED_TO_RELEASE_GATE: Windows shards did not run in the development gate."'

  release:
    name: Verify (ubuntu-latest)
    needs: impact
    if: always() && (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.impact.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm run typecheck
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm run build
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm test
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm run validate:plugin
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - name: Verify complete generated-artifact freshness
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        run: npm run check:generated
      - name: Check patch whitespace
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        run: git diff --check
      - name: Full Ubuntu suite deferred
        if: github.event_name != 'push' && needs.impact.outputs.release_required != 'true'
        shell: bash
        run: 'echo "FULL_SUITE_DEFERRED_TO_RELEASE_GATE: Ubuntu complete regression did not run in the development gate."'

  windows-result:
    name: Verify (windows-2022)
    needs: [impact, verify-windows]
    if: always() && (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.impact.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both Windows shards to pass
        shell: bash
        run: |
          if [[ "${{ needs.verify-windows.result }}" != "success" ]]; then
            echo "::error::At least one Windows verification shard did not pass."
            exit 1
          fi
          echo "Both Windows verification shards passed."

  sqlite-stress:
    name: SQLite resource matrix (${{ matrix.os }})
    needs: impact
    if: always() && (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.impact.result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - run: npm run test:stress
        if: github.event_name == 'push' || needs.impact.outputs.release_required == 'true'
      - name: SQLite stress matrix deferred
        if: github.event_name != 'push' && needs.impact.outputs.release_required != 'true'
        shell: bash
        run: echo "SQLite stress matrix deferred to the complete release gate."

  cost-lab:
    name: Cost Lab tests
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.outputs.cost_lab_required == 'true'))
    # Cost Lab's official-runtime protocol smoke and Windows path discovery
    # contracts exercise the supported Windows product boundary directly.
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run cost-lab:test
