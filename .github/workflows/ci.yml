name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
      - preview
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0

jobs:
  impact:
    name: Select impact gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force_full: ${{ steps.select.outputs.force_full }}
      full_required: ${{ steps.select.outputs.full_required }}
      integration_required: ${{ steps.select.outputs.integration_required }}
      stress_required: ${{ steps.select.outputs.stress_required }}
      cost_lab_required: ${{ steps.select.outputs.cost_lab_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: select
        name: Shadow-compare impact selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/ci-select-impact.mjs --head "$HEAD_SHA" --force-full --github-output
          else
            node scripts/ci-select-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          fi

  fast:
    name: Fast PR gate
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.full_required != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fast targeted selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Fast impact selection requires a valid base SHA"
            exit 1
          fi
          npm run test:affected -- --base "$BASE_SHA"

  integration:
    name: Integration gate (Windows)
    needs: [impact, fast]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.fast.result == 'success' && needs.impact.outputs.integration_required == 'true' && needs.impact.outputs.full_required != 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fast owns the platform-independent T0 checks. This Windows gate only
      # builds the Windows execution artifacts and runs the selected tests.
      - run: npm run build
      - name: Verify Windows worker process identity
        run: node scripts/verify-windows-worker-identity.mjs
      - name: Impacted integration and task-lifecycle tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CODEX_BRIDGE_CI_T0_COMPLETED: "1"
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Integration selection requires a valid base SHA"
            exit 1
          fi
          npm run test:affected -- --base "$BASE_SHA" --tests-only

  verify-windows:
    name: Windows Verify shard ${{ matrix.shard }}/2
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.result == 'success' && needs.impact.outputs.full_required == 'true'))
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Windows worker process identity
        if: matrix.shard == 1
        run: node scripts/verify-windows-worker-identity.mjs
      - name: Prepare isolated shard directories
        shell: pwsh
        env:
          SHARD_TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          SHARD_FIXTURES: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:SHARD_TEMP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SHARD_FIXTURES | Out-Null
      - name: Run Windows shard
        env:
          WP6_TEST_FIXTURE_ROOT: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
          TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMPDIR: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
        run: npm run test:shard -- --shard=${{ matrix.shard }}/2

  release:
    name: Verify (ubuntu-latest)
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.result == 'success' && needs.impact.outputs.full_required == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run validate:plugin
      - name: Verify complete generated-artifact freshness
        run: npm run check:generated
      - name: Check patch whitespace
        run: git diff --check

  windows-result:
    name: Verify (windows-2022)
    needs: [impact, verify-windows]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.result == 'success' && needs.impact.outputs.full_required == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both Windows shards to pass
        shell: bash
        run: |
          if [[ "${{ needs.verify-windows.result }}" != "success" ]]; then
            echo "::error::At least one Windows verification shard did not pass."
            exit 1
          fi
          echo "Both Windows verification shards passed."

  sqlite-stress:
    name: SQLite resource matrix (${{ matrix.os }})
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.result == 'success' && (needs.impact.outputs.force_full == 'true' || needs.impact.outputs.full_required == 'true' || needs.impact.outputs.stress_required == 'true')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:stress

  cost-lab:
    name: Cost Lab tests
    needs: impact
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.impact.outputs.cost_lab_required == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run cost-lab:test
