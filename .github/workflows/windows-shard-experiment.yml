name: Windows Shard Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ci-performance-test-optimization-20261120
    paths:
      - .github/workflows/windows-shard-experiment.yml

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0

jobs:
  shard:
    name: Windows shard ${{ matrix.shard }}/2
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare isolated shard directories
        shell: pwsh
        env:
          SHARD_TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          SHARD_FIXTURES: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:SHARD_TEMP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SHARD_FIXTURES | Out-Null
      - name: Run Windows shard
        env:
          WP6_TEST_FIXTURE_ROOT: ${{ runner.temp }}\bridge-test-fixtures\shard-${{ matrix.shard }}
          TEMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMP: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
          TMPDIR: ${{ runner.temp }}\bridge-test-temp\shard-${{ matrix.shard }}
        run: npm run test:shard -- --shard=${{ matrix.shard }}/2

  result:
    name: Windows shard experiment result
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both shards to pass
        shell: bash
        run: |
          if [[ "${{ needs.shard.result }}" != "success" ]]; then
            echo "At least one Windows shard failed."
            exit 1
          fi
          echo "Both Windows shards passed."
