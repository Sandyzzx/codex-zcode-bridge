name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2025 currently times out the documented PowerShell
        # process-identity probe. Keep lifecycle verification on Server 2022.
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Windows worker process identity
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-worker-identity.mjs
      - run: npm test
      - run: npm run validate:plugin
      - name: Check plugin schemas are tracked
        run: git ls-files --error-unmatch plugins/codex-zcode-bridge/dist/schema.sql plugins/codex-zcode-bridge/dist/admin-abandonment.sql
      - name: Check generated plugin bundles are committed
        run: git diff --exit-code -- plugins/codex-zcode-bridge/dist/bridge.mjs plugins/codex-zcode-bridge/dist/schema.sql plugins/codex-zcode-bridge/dist/admin-abandonment.sql plugins/codex-zcode-bridge/worker/worker-main.mjs
